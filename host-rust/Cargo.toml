[package]
name = "elasticgrid_ae"
version = "0.9.4"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[features]
default = ["native-plane"]
native-plane = []
# Test-only callback observation; never enabled by default.
render-diagnostics = []
# Isolated public PREVIEW callback experiment; no overlay implementation.
preview-overlay-probe = []
# Same bounded gesture log, without requesting PREVIEW callbacks.
gesture-probe = ["preview-overlay-probe"]
# Isolated hang diagnosis: no loupe frame requests or diagnostic file logging.
# Not a product workaround; the lens has no source pixels in this build.
loupe-source-disabled-probe = []
# Read-only host quality census during short loupe gestures; no pixel override.
interactive-quality-probe = []

[dependencies]
after-effects = "=0.4.0"
serde = { version = "=1.0.229", features = ["derive"] }

[build-dependencies]
pipl = "=0.1.1"
cc = "=1.5.1"

[target.'cfg(windows)'.build-dependencies]
pipl-fixed = { path = "pipl-fixed" }

[dev-dependencies]
bincode = { version = "=2.0.1", features = ["serde"] }
