[package]
name = "elasticgrid_ae"
version = "0.9.4"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[features]
default = ["native-plane", "owned-corner-drag"]
native-plane = []
# UI ownership keeps canonical Point streams and native editing intact.
corner-ownership = []
# Surface/Perspective overlay-only drag with one saved commit on release.
owned-corner-drag = ["corner-ownership"]
# Test-only callback observation; never enabled by default.
render-diagnostics = []
# Isolated public PREVIEW callback experiment; no overlay implementation.
preview-overlay-probe = []
# Same bounded gesture log, without requesting PREVIEW callbacks.
gesture-probe = ["preview-overlay-probe"]
# Isolated hang diagnosis: no loupe frame requests or diagnostic file logging.
# Not a product workaround; the lens has no source pixels in this build.
loupe-source-disabled-probe = []
# Read-only host quality census during short loupe gestures; no pixel override.
interactive-quality-probe = []
# Validation only: request UI-only render deferral during scoped corner gestures.
# Retain the bounded census to verify whether the native Point loop honors it.
deferred-corner-probe = ["interactive-quality-probe"]
# Passive resource census; ordinary builds remain unchanged.
resource-census-probe = []
# Native routing experiment only. Hide canonical point ECW controls while
# retaining their data streams/Timeline keys; never a product UI replacement.
corner-ui-ownership-probe = ["resource-census-probe"]
# One-variable native hit-priority probe: temporarily disable standard Point
# controls only while our viewer corner is hovered. Keep coordinate rows/keys.
corner-hit-probe = ["resource-census-probe", "corner-ownership"]
# Validation of an owned corner transaction; no canonical writes until release.
frozen-corner-probe = ["corner-hit-probe", "owned-corner-drag"]

[dependencies]
after-effects = "=0.4.0"
serde = { version = "=1.0.229", features = ["derive"] }

[build-dependencies]
pipl = "=0.1.1"
cc = "=1.5.1"

[target.'cfg(windows)'.build-dependencies]
pipl-fixed = { path = "pipl-fixed" }

[dev-dependencies]
bincode = { version = "=2.0.1", features = ["serde"] }
