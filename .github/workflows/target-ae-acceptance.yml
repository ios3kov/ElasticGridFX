name: Target AE acceptance package
on:
  push:
    branches: [fix/final-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: target-ae-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Runner safety/unit tests (NOT AE)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acceptance-evidence"
          { python3 -m unittest discover -s tests -p 'test_target_ae_acceptance.py' -v
            python3 -m unittest discover -s tests -p 'test_smoke_pixels.py' -v
            node tests/test_smoke_safety.js
          } 2>&1 | tee "$RUNNER_TEMP/acceptance-evidence/tests.log"
          bash -n RUN_ELASTICGRID_AE_TEST_MAC.command
          git diff --exit-code
      - name: Retrieve exact green fd69988 candidate (never rebuild)
        uses: actions/download-artifact@v4
        with:
          name: ElasticGridFX-mac-source-gate
          run-id: 36542759949
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/candidate
      - name: Package pinned acceptance runner
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_target_ae_acceptance.py             "$RUNNER_TEMP/candidate/dist/mac/ElasticGrid.plugin.zip"             "$RUNNER_TEMP/ElasticGridFX-AE-Acceptance.zip"             | tee "$RUNNER_TEMP/acceptance-evidence/package.json"
      - name: Upload runner and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ElasticGridFX-AE-acceptance-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ElasticGridFX-AE-Acceptance.zip
            ${{ runner.temp }}/acceptance-evidence/**
