name: Exact density blob transfer (no ref writes)
on:
  push:
    branches: [chore/density-blob-transfer-20260930]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reconstruct exact reviewed tree and store blobs only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='ios3kov/ElasticGridFX'
          assert os.environ['GITHUB_REF']=='refs/heads/chore/density-blob-transfer-20260930'
          source=pathlib.Path.cwd()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'density-reviewed'
          base='7f7220168421491fe1cbe3ebf74041810c5ebb52'
          expected='6a2ce3ce9269f82e091b114ad9ea61378e17b2b8'
          subprocess.run(['git','worktree','add','--detach',str(root),base],check=True)
          def git(*args):
              return subprocess.check_output(['git','-C',str(root),*args])
          assert git('rev-parse','HEAD').decode().strip()==base
          names=['docs/grid-density-preserve-animation-2026-09-30.md','host-rust/src/control_grid.rs','host-rust/src/control_grid_tests.rs','src/bridge/control_grid_ffi.cpp','src/bridge/control_grid_ffi.h','tests/test_control_density.cpp','tests/test_control_density_contract.py']
          for name in names:
              path=root/name
              assert not path.exists() and not (source/name).is_symlink()
              path.write_bytes((source/name).read_bytes()); path.chmod(0o644)
          subprocess.run(['git','-C',str(root),'apply','--unidiff-zero','--check',str(source/'transfer/density-existing.patch')],check=True)
          subprocess.run(['git','-C',str(root),'apply','--unidiff-zero',str(source/'transfer/density-existing.patch')],check=True)
          subprocess.run(['git','-C',str(root),'add','.'],check=True)
          paths=git('ls-files','-z').decode().split('\0')
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((root/p).read_bytes()).hexdigest()+'  '+p+'\n' for p in sorted(paths) if p and p!='SHA256SUMS.txt'))
          subprocess.run(['git','-C',str(root),'add','SHA256SUMS.txt'],check=True)
          actual=git('write-tree').decode().strip()
          print('reviewed tree',actual)
          assert actual==expected, 'Transfer mismatch: no blobs uploaded and no refs changed'
          changed=git('diff','--cached','--name-only','-z').decode().split('\0')
          result=[]
          for p in changed:
              if not p: continue
              data=(root/p).read_bytes()
              wanted=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              body=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
              req=urllib.request.Request('https://api.github.com/repos/ios3kov/ElasticGridFX/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  received=json.load(response)['sha']
              assert received==wanted
              result.append({'path':p,'sha':received})
          print(json.dumps({'tree':actual,'blobs':result,'refs_changed':False},indent=2))
          PY
