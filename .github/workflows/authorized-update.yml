name: Authorized update safety
on:
  push:
    branches: [fix/final-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: authorized-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-update:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified 2026-10-02
        with:
          persist-credentials: false
      - name: Replacement, rollback and native signature/xattr tests (NOT AE)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/update-evidence"
          { python3 -m unittest discover -s tests -p 'test_adobe_process_guard.py' -v; python3 -m unittest discover -s tests -p 'test_update_start.py' -v; python3 -m unittest discover -s tests -p 'test_authorized_update.py' -v; python3 -m unittest discover -s tests -p 'test_update_package_permissions.py' -v; python3 -m unittest discover -s tests -p 'test_xattr_reader.py' -v; } 2>&1 | tee "$RUNNER_TEMP/update-evidence/tests.log"
          bash -n UPDATE_ELASTICGRID_MAC.command ROLLBACK_ELASTICGRID_MAC.command
          git diff --exit-code
      - name: Retrieve previously verified immutable candidate (never rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, verified 2026-10-02
        with:
          name: ElasticGridFX-mac-source-gate
          run-id: 36542759949
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pinned-candidate
      - name: Package clean updater with byte-identical pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_authorized_update.py "$RUNNER_TEMP/pinned-candidate/dist/mac/ElasticGrid.plugin.zip" "$RUNNER_TEMP/ElasticGridFX-Test-Update.zip" | tee "$RUNNER_TEMP/update-evidence/package.json"
          mkdir "$RUNNER_TEMP/extracted-update"
          /usr/bin/ditto -x -k "$RUNNER_TEMP/ElasticGridFX-Test-Update.zip" "$RUNNER_TEMP/extracted-update"
          root="$RUNNER_TEMP/extracted-update/ElasticGridFX-Test-Update-fd69988"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          sys.path.insert(0,str(root/'tools'))
          import build_identity as bi
          tool=json.loads((root/'InstallToolIdentity.json').read_text())
          if tool.get('source_state')!='clean' or tool.get('files')!=bi.hashes(root,tool['files']):
              raise SystemExit('extracted updater self-integrity mismatch')
          print('PASS: extracted updater hashes and execute bits match InstallToolIdentity')
          PY
      - name: Retain package and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-02
        with:
          name: ElasticGridFX-update-fd69988-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/update-evidence/
            ${{ runner.temp }}/ElasticGridFX-Test-Update.zip
