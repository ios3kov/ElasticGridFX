name: Exact coordinate blob transfer (no ref writes)
on:
  push:
    branches: [chore/fit-coordinate-transfer-20260930]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6a7f5a3aa8d5135485759ee1d64c4ffca12f5bae
          persist-credentials: false
      - name: Reconstruct reviewed trees and store blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'ios3kov/ElasticGridFX'
          root = pathlib.Path.cwd()
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD').decode().strip() == '6a7f5a3aa8d5135485759ee1d64c4ffca12f5bae'
          assert git('write-tree').decode().strip() == '49c524cf336bec9d505aba83d655fe33e4734566'
          url = 'https://api.github.com/repos/ios3kov/ElasticGridFX/git/blobs'
          def api(suffix='', data=None):
              req = urllib.request.Request(url+suffix, data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def newfile(path, sha):
              target = root/path
              assert not target.exists()
              data = base64.b64decode(api('/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              target.chmod(0o644)
              git('add', path)
          def replace(path, old, new, count=1):
              f = root/path
              text = f.read_text()
              assert text.count(old) >= count, path
              f.write_text(text.replace(old, new, count))
              git('add', path)
          uploaded = set()
          def store(expected):
              names = sorted(n for n in git('ls-files').decode().splitlines() if n != 'SHA256SUMS.txt')
              (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(git('show', ':'+n)).hexdigest()+'  '+n+'\n' for n in names))
              git('add', 'SHA256SUMS.txt')
              actual = git('write-tree').decode().strip()
              assert actual == expected, (actual, expected)
              for name in git('diff', '--cached', '--name-only', 'HEAD').decode().splitlines():
                  data = git('show', ':'+name)
                  sha = git('rev-parse', ':'+name).decode().strip()
                  if sha not in uploaded:
                      result = api(data={'content':base64.b64encode(data).decode(), 'encoding':'base64'})
                      assert result['sha'] == sha
                      uploaded.add(sha)
                  print(json.dumps({'path':name, 'sha':sha}))
              print('VERIFIED_TREE '+actual)
          newfile('host-rust/src/fit_layer.rs', '3f487866deeab7f49080a090a151ca7c7ad7ca7c')
          newfile('host-rust/src/fit_layer_tests.rs', '473fe15df844bd31b61420ab02551c8afec0fca4')
          newfile('tests/test_fit_layer_contract.py', '884cd22147a6feefc2b69d0a2876ff20e48fe3a2')
          replace('host-rust/src/lib.rs', 'mod plane;', 'mod plane;\nmod fit_layer;')
          f=root/'host-rust/src/lib.rs'; text=f.read_text()
          a=text.index('                    // Layer-space last pixel centers match the legacy raster')
          b=text.index('                if params.index(Params::Columns)', a)
          text=text[:a]+'''                    if fit_layer::apply(&in_data, params)? {
                                  out_data.set_out_flag(ae::OutFlags::ForceRerender, true);
                              }
                          }
          '''+text[b:]
          # The literal above has YAML indentation removed; set exact Rust spacing.
          text=text.replace('                                  out_data.set_out_flag', '                        out_data.set_out_flag')
          text=text.replace('                              }\n                          }\n', '                    }\n                }\n')
          f.write_text(text); git('add','host-rust/src/lib.rs')
          replace('CMakeLists.txt', '0.9.2', '0.9.3')
          replace('host-rust/Cargo.toml', '0.9.2', '0.9.3')
          replace('host-rust/Cargo.lock', 'name = "elasticgrid_ae"\nversion = "0.9.2"', 'name = "elasticgrid_ae"\nversion = "0.9.3"')
          replace('host-rust/build.rs', 'bugversion: 2,', 'bugversion: 3,')
          for path in ['.github/workflows/macos-source-gate.yml','.github/workflows/first-application-regression.yml']:
              replace(path, 'fix/grid-density-preserve-animation]', 'fix/grid-density-preserve-animation, fix/fit-layer-coordinates]')
          store('9604628ac02bbb7fbc23f2b05d570d37a2289c88')
          newfile('tools/bundle_version.py','53fc9260fda669e33a68c0eef7d50ad880f1b6dc')
          newfile('tests/test_bundle_version.py','23e8861fc9247a60188782ea304046770b8d8b3b')
          f=root/'tools/build_macos_sdkless.command'; text=f.read_text()
          a=text.index("/usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString")
          b=text.index('python3 "$ROOT/tools/build_identity.py" stamp', a)
          text=text[:a]+text[b:]
          needle='python3 "$ROOT/tools/build_identity.py" stamp --root "$ROOT" --bundle "$BUNDLE" --cargo-log "$DIST/host-build.jsonl"'
          assert needle in text
          text=text.replace(needle,needle+'\npython3 "$ROOT/tools/bundle_version.py" stamp "$BUNDLE"',1)
          f.write_text(text.replace('Building ElasticGrid FX v0.9 (native', 'Building FSTR Stretch (native'))
          git('add','tools/build_macos_sdkless.command')
          replace('tools/verify_bundle_macos.command', "printf '[bundle] binary\\n'", 'python3 "$ROOT/tools/bundle_version.py" verify "$BUNDLE"\n\nprintf \'[bundle] binary\\n\'')
          prefix='''# Current development / release status

          ## Development: Fit Layer boundary correction — 2026-09-30

          Stage 10, branch `fix/fit-layer-coordinates`, stacked on PR #12. The source
          corrects Fit to (0,0)/(W,0)/(W,H)/(0,H), with the existing corner order and full
          source-layer dimensions. It skips writes to already-fitted corners, including
          repeat Fit. It does not write Grid Positions/counts or migrate stored keys.
          Rendering, layer/comp projections and the density implementation are unchanged.
          The extra Layer Plane overlay/index-span audit still requires native AE
          alignment evidence; a global change to raster coordinates was not made.

          Version 0.9.3 development; not released. The source also derives Finder version
          from validated BuildIdentity before signing (#13), and the native verifier
          checks both version fields on the named and extracted bundle. This is not an
          in-place edit of a prior candidate. Exact final CI/artifact evidence is in the
          correction PR; live target AE is NOT RUN in this Linux session.

          The user reported the density candidate 59a73ea working, then supplied the Fit
          coordinate mismatch. That historical density acceptance is not a new-candidate
          host PASS. See [coordinate acceptance](fit-layer-coordinate-fix-2026-09-30.md).

          ## Historical density checkpoint
          '''
          replace('docs/current-status.md','# Current development / release status\n',prefix)
          store('e9cdba7bfada7b293bd2064706d48c1d7e10d89b')
          print('Transfer complete; no ref, installation or release changes')
          PY
