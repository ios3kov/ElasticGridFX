name: Exact coordinate blob transfer (no ref writes)
on:
  push:
    branches: [chore/fit-coordinate-transfer-20260930]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 9ab18fe1670b3e1e6f8ac18acd6c9d8bccd0d871
          persist-credentials: false
      - name: Store two exact reviewed blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='ios3kov/ElasticGridFX'
          def git(*args): return subprocess.check_output(['git',*args])
          assert git('write-tree').decode().strip()=='e9cdba7bfada7b293bd2064706d48c1d7e10d89b'
          path=pathlib.Path('host-rust/src/lib.rs'); text=path.read_text()
          old='                    if fit_layer::apply(&in_data, params)? {'
          new='                    let changed = fit_layer::apply(&in_data, params)?;\n                    if changed {'
          assert text.count(old)==1
          path.write_text(text.replace(old,new)); git('add',str(path))
          names=sorted(n for n in git('ls-files').decode().splitlines() if n!='SHA256SUMS.txt')
          pathlib.Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(git('show',':'+n)).hexdigest()+'  '+n+'\n' for n in names))
          git('add','SHA256SUMS.txt')
          assert git('write-tree').decode().strip()=='5ab7ba6f9e7089e8b8c4511d912990ef2c5ce614'
          for name in ['host-rust/src/lib.rs','SHA256SUMS.txt']:
              data=git('show',':'+name); sha=git('rev-parse',':'+name).decode().strip()
              req=urllib.request.Request('https://api.github.com/repos/ios3kov/ElasticGridFX/git/blobs',
                  data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              assert result['sha']==sha
              print(name,sha)
          print('VERIFIED_TREE 5ab7ba6f9e7089e8b8c4511d912990ef2c5ce614; no refs changed')
          PY
