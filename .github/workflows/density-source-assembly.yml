name: Assemble hash-checked density source
on:
  push:
    branches: [feat/grid-density-independent]
    paths: ['.density-edit-*.py', '.github/workflows/density-source-assembly.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'ios3kov/ElasticGridFX' && github.ref == 'refs/heads/feat/grid-density-independent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply literal edits to pinned baseline and prove the exact final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, hashlib, os, pathlib, shutil, subprocess, tempfile
          base='7f7220168421491fe1cbe3ebf74041810c5ebb52'
          expected='dceaa93a24084c5782cc622bd9a983ec62cc268f'
          helper='.github/workflows/density-source-assembly.yml'
          hashes=['8313bbc6bd0d20dd17f177e063dc4ea6184cb38f','08c4a45996bd5f36c3a6e1954cf3157dd9d8a1e9','feb41de53a4c835cfad2cb455af48fbdb0ea1bc6','2391c149485cca56529679aaf2dba88aef0fdc60','4efc966a56b5ddd629e23df9fafac1ca8a3c7dc1','49eabe88509386310a0145912a1eec1c89b1cce9']
          def git(*args): return subprocess.check_output(['git',*args])
          assert os.environ['GITHUB_REPOSITORY']=='ios3kov/ElasticGridFX'
          assert os.environ['GITHUB_REF']=='refs/heads/feat/grid-density-independent'
          assert git('rev-parse','HEAD').decode().strip()==os.environ['GITHUB_SHA']
          assert not git('status','--porcelain')
          baseline={p.decode() for p in git('ls-tree','-r','--name-only','-z',base).split(b'\0') if p}
          edits={}
          for i, digest in enumerate(hashes):
              raw=pathlib.Path(f'.density-edit-{i}.py').read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==digest
              for node in ast.parse(raw.decode()).body:
                  assert isinstance(node,ast.Expr) and isinstance(node.value,ast.Call)
                  call=node.value
                  assert isinstance(call.func,ast.Name) and call.func.id=='put' and not call.keywords and len(call.args)==2
                  path=ast.literal_eval(call.args[0]); ops=ast.literal_eval(call.args[1])
                  assert isinstance(path,str) and path not in edits
                  parts=pathlib.PurePosixPath(path).parts
                  assert parts and not path.startswith('/') and '..' not in parts and '.git' not in parts and '\\' not in path
                  assert path!=helper and not path.startswith('.density-') and path!='SHA256SUMS.txt'
                  assert isinstance(ops,list)
                  old=git('show',base+':'+path) if path in baseline else b''
                  lines=old.decode().splitlines(keepends=True)
                  previous=0
                  for start,count,text in ops:
                      assert type(start) is int and type(count) is int and isinstance(text,str)
                      assert previous<=start<=len(lines) and 0<=count<=len(lines)-start and len(text)<200000
                      previous=start+count
                  for start,count,text in reversed(ops): lines[start:start+count]=text.splitlines(keepends=True)
                  edits[path]=''.join(lines).encode()
          # All script data has been read; no arbitrary Python is executed.
          for path,data in edits.items():
              target=pathlib.Path(path)
              for ancestor in [target,*target.parents]: assert not ancestor.is_symlink()
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          git('add','--',*sorted(edits))
          git('rm','--',*[f'.density-edit-{i}.py' for i in range(6)])
          files=[p.decode() for p in git('ls-files','-z').split(b'\0') if p]
          sums=''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()+'  '+p+'\n' for p in sorted(files) if p not in ['SHA256SUMS.txt',helper])
          pathlib.Path('SHA256SUMS.txt').write_text(sums)
          git('add','SHA256SUMS.txt'); git('diff','--cached','--check')
          # GITHUB_TOKEN cannot modify workflows. This bootstrap remains exactly
          # unchanged until the authorized connector removes it in the final commit.
          assert git('diff','--cached','--name-only','--','.github/workflows')==b''
          index=pathlib.Path(git('rev-parse','--git-path','index').decode().strip())
          with tempfile.TemporaryDirectory() as temp:
              copy=pathlib.Path(temp)/'index'; shutil.copyfile(index,copy)
              env=dict(os.environ,GIT_INDEX_FILE=str(copy))
              subprocess.run(['git','update-index','--force-remove',helper],env=env,check=True)
              tree=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
              assert tree==expected,(tree,expected)
          print('VERIFIED FINAL SOURCE TREE (after connector cleanup):',tree)
          PY
          test "$(git ls-remote origin refs/heads/feat/grid-density-independent | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'FSTR Development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: separate guide density from keyed deformation' -m 'Exact source tree verified. Temporary assembly workflow requires connector cleanup before build. No merge, release or AE execution.'
          git push origin HEAD:refs/heads/feat/grid-density-independent
          printf 'ASSEMBLED_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'ASSEMBLED_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
