name: macOS source gate

on:
  workflow_dispatch:
  push:
    branches: [chore/github-ci-v1, fix/original-gridwarp-parity, fix/smartfx-param-snapshot, build/smartfx-param-snapshot-mac-test]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: macos-source-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-source-gate:
    name: macOS / Metal source validation
    runs-on: macos-14
    timeout-minutes: 90
    # GitHub-hosted macOS ARM runners currently expose no MTLDevice. This flag
    # makes only the four hardware-execution stages compile-only. Physical-Mac
    # preflight does not set it and remains strict.
    env:
      ELASTICGRID_METAL_COMPILE_ONLY: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          clang++ --version
          rustc --version
          cargo --version
      - name: Verify committed Cargo.lock
        run: |
          test -f host-rust/Cargo.lock
          cargo metadata --locked --format-version 1 --manifest-path host-rust/Cargo.toml >/dev/null
      - name: Compile Metal shader with Apple toolchain
        run: |
          xcrun -sdk macosx metal -c src/gpu/warp.metal -o "$RUNNER_TEMP/elasticgrid-warp.air"
          xcrun -sdk macosx metallib "$RUNNER_TEMP/elasticgrid-warp.air" -o "$RUNNER_TEMP/elasticgrid-warp.metallib"
      - name: Full macOS preflight
        if: github.ref != 'refs/heads/build/smartfx-param-snapshot-mac-test'
        run: tools/preflight_macos.command
      - name: Build unsigned-install-free plugin bundle
        if: github.ref != 'refs/heads/build/smartfx-param-snapshot-mac-test'
        run: tools/build_macos_sdkless.command
      - name: Build SmartFX snapshot test plugin
        if: github.ref == 'refs/heads/build/smartfx-param-snapshot-mac-test'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo test --release --locked --manifest-path host-rust/Cargo.toml
          cargo build --release --locked --manifest-path host-rust/Cargo.toml
          BUNDLE="dist/mac/ElasticGrid.plugin"
          TARGET="host-rust/target/release"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
          cp "$TARGET/libelasticgrid_ae.dylib" "$BUNDLE/Contents/MacOS/ElasticGrid"
          cp "$TARGET/elasticgrid_ae.rsrc" "$BUNDLE/Contents/Resources/ElasticGrid.rsrc"
          cp "$TARGET/elasticgrid_ae_PkgInfo" "$BUNDLE/Contents/PkgInfo"
          cp "$TARGET/elasticgrid_ae_Info.plist" "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.elasticgrid.fx' "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string ElasticGrid' "$BUNDLE/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable ElasticGrid' "$BUNDLE/Contents/Info.plist"
          xattr -cr "$BUNDLE" || true
          codesign --force --deep --sign - "$BUNDLE"
          tools/verify_bundle_macos.command "$BUNDLE"

          PACKAGE="dist/mac/ElasticGridFX-SMARTFX-SNAPSHOT"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE"
          cp -R "$BUNDLE" "$PACKAGE/ElasticGrid.plugin"
          printf '%s\n' "$GITHUB_SHA" > "$PACKAGE/BUILD_COMMIT.txt"
          shasum -a 256 "$PACKAGE/ElasticGrid.plugin/Contents/MacOS/ElasticGrid" | awk '{print $1}' > "$PACKAGE/ELASTICGRID_BINARY_SHA256.txt"
          cat > "$PACKAGE/INSTALL_CLEAN_MAC.command" <<'INSTALLER'
          #!/bin/bash
          set -euo pipefail

          HERE="$(cd "$(dirname "$0")" && pwd)"
          SOURCE="$HERE/ElasticGrid.plugin"
          EXPECTED_SHA="$(tr -d '[:space:]' < "$HERE/ELASTICGRID_BINARY_SHA256.txt")"
          SYSTEM_ROOT="/Library/Application Support/Adobe/Common/Plug-ins/7.0/MediaCore"
          USER_ROOT="$HOME/Library/Application Support/Adobe/Common/Plug-ins/7.0/MediaCore"
          DEST_ROOT="$SYSTEM_ROOT/FSTR FX"
          DEST="$DEST_ROOT/ElasticGrid.plugin"

          if pgrep -if 'Adobe After Effects|After Effects' >/dev/null 2>&1; then
            echo "ERROR: fully quit After Effects before clean install."
            exit 2
          fi
          test -d "$SOURCE" || { echo "ERROR: test plugin is missing next to installer."; exit 3; }

          echo "[1/5] Removing old ElasticGrid.plugin copies..."
          for root in "$SYSTEM_ROOT" "$USER_ROOT"; do
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' old; do
              echo "remove: $old"
              sudo rm -rf "$old"
            done < <(find "$root" -type d -name 'ElasticGrid.plugin' -print0 2>/dev/null)
          done

          echo "[2/5] Removing After Effects plugin-cache files..."
          for root in "$HOME/Library/Preferences/Adobe/After Effects" "$HOME/Library/Caches/Adobe/After Effects"; do
            [[ -d "$root" ]] || continue
            find "$root" -type f \( -iname '*PluginCache*' -o -iname '*plugin*cache*' \) -delete 2>/dev/null || true
          done

          echo "[3/5] Installing fresh build..."
          sudo mkdir -p "$DEST_ROOT"
          sudo cp -R "$SOURCE" "$DEST"
          sudo xattr -cr "$DEST" || true
          codesign --verify --deep --strict "$DEST"

          echo "[4/5] Verifying SHA-256..."
          ACTUAL_SHA="$(shasum -a 256 "$DEST/Contents/MacOS/ElasticGrid" | awk '{print $1}')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || {
            echo "ERROR: installed binary SHA mismatch."
            echo "expected: $EXPECTED_SHA"
            echo "actual:   $ACTUAL_SHA"
            exit 4
          }

          echo "[5/5] Verifying exactly one installed copy..."
          COUNT=0
          for root in "$SYSTEM_ROOT" "$USER_ROOT"; do
            [[ -d "$root" ]] || continue
            while IFS= read -r _; do COUNT=$((COUNT + 1)); done < <(find "$root" -type d -name 'ElasticGrid.plugin' -print 2>/dev/null)
          done
          [[ "$COUNT" -eq 1 ]] || { echo "ERROR: expected exactly one ElasticGrid.plugin, found $COUNT."; exit 5; }

          echo "PASS: clean test build installed"
          echo "path: $DEST"
          echo "sha256: $ACTUAL_SHA"
          echo "Next: launch After Effects into a NEW EMPTY project and verify the Effect Controls marker says SMARTFX-SNAPSHOT."
          INSTALLER
          chmod +x "$PACKAGE/INSTALL_CLEAN_MAC.command"
      - name: Upload plugin and reports
        uses: actions/upload-artifact@v4
        with:
          name: ElasticGridFX-mac-source-gate
          if-no-files-found: error
          path: |
            dist/mac/ElasticGrid.plugin
            dist/mac/ElasticGridFX-SMARTFX-SNAPSHOT/**
            dist/mac/preflight-report.txt
            dist/compliance/**
            host-rust/Cargo.lock
