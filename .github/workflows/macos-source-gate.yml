name: macOS source gate

on:
  workflow_dispatch:
  push:
    branches: [chore/github-ci-v1, fix/original-gridwarp-parity, fix/smartfx-param-snapshot, fix/final-validation, fix/first-application-516, fix/grid-density-preserve-animation, fix/fit-layer-coordinates, perf/plane-render-throughput]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: macos-source-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-source-gate:
    name: macOS / Metal source validation
    runs-on: macos-14
    timeout-minutes: 90
    # GitHub-hosted macOS ARM runners currently expose no MTLDevice. This flag
    # makes only the four hardware-execution stages compile-only. Physical-Mac
    # preflight does not set it and remains strict.
    env:
      ELASTICGRID_METAL_COMPILE_ONLY: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          clang++ --version
          rustc --version
          cargo --version
      - name: Verify committed Cargo.lock
        run: |
          test -f host-rust/Cargo.lock
          cargo metadata --locked --format-version 1 --manifest-path host-rust/Cargo.toml >/dev/null
      - name: Compile Metal shader with Apple toolchain
        run: |
          xcrun -sdk macosx metal -c src/gpu/warp.metal -o "$RUNNER_TEMP/elasticgrid-warp.air"
          xcrun -sdk macosx metallib "$RUNNER_TEMP/elasticgrid-warp.air" -o "$RUNNER_TEMP/elasticgrid-warp.metallib"
      - name: Portable acceptance-tooling regression on macOS
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          for test in tests/test_*.js; do node "$test"; done
      # Expensive full build runs only after fast cross-platform tooling gates.
      # The bundle command runs the entire mandatory preflight exactly once.
      - name: Full preflight and install-free signed plugin bundle
        run: tools/build_macos_sdkless.command
      - name: Read-only candidate inspection and smoke preparation (NOT AE execution)
        run: |
          python3 tools/install_candidate.py > dist/mac/install-inspection.json
          python3 tools/ae_smoke_runner.py --run-root "$RUNNER_TEMP/egfx-smoke" > dist/mac/smoke-preparation.json
      - name: Upload plugin and reports
        uses: actions/upload-artifact@v4
        with:
          name: ElasticGridFX-mac-source-gate
          if-no-files-found: error
          path: |
            dist/mac/ElasticGrid.plugin
            dist/mac/preflight-report.txt
            dist/mac/ElasticGrid.plugin.zip
            dist/mac/ElasticGrid.artifact.json
            dist/mac/delivery/FSTR Stretch.plugin.zip
            dist/mac/delivery/FSTR Stretch.artifact.json
            dist/mac/delivery-packaging.json
            dist/mac/host-build.jsonl
            dist/mac/install-inspection.json
            dist/mac/smoke-preparation.json
            dist/compliance/**
            host-rust/Cargo.lock
      - name: Record source state and keep failed-run diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p dist/mac
          {
            printf 'run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD
            git status --porcelain --untracked-files=all
          } > dist/mac/source-state.txt
      - name: Upload diagnostic reports (not an installable candidate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ElasticGridFX-mac-diagnostics-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/mac/source-state.txt
            dist/mac/preflight-report.txt
            dist/mac/host-build.jsonl
            dist/compliance/**
