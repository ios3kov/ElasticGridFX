# Hot-loader adapter gate
name: Hot Loader Shell CI

on:
  push:
    branches: ["feature/ae-hot-loader-shell"]
    paths:
      - ".github/workflows/hot-loader-shell-ci.yml"
      - "host-rust/**"
      - "tools/build_macos_sdkless.command"
      - "tools/verify_bundle_macos.command"
      - "tools/verify_shell_metadata.py"
      - "tools/verify_hot_reload_state.py"
      - "tools/stage_hot_reload_macos.command"
      - "tools/install_hot_loader_package.command"
      - "tools/stage_packaged_hot_reload.command"
      - "tools/rollback_packaged_hot_reload.command"
      - "tools/collect_hot_loader_logs.command"
      - "docs/hot-loader-live-test.md"
      - "docs/original-gridwarp-binary-audit.md"
  workflow_dispatch:

concurrency:
  group: elasticgrid-hot-loader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin

      - name: Static shell checks
        run: |
          set -euo pipefail
          python3 tools/verify_shell_metadata.py host-rust/build.rs host-rust/shell/ElasticGridShell.cpp
          python3 tools/verify_hot_reload_state.py host-rust/src/lib.rs host-rust/shell/ElasticGridShell.cpp
          grep -q "checkout_smart_render_dependencies(in_data, params)" host-rust/src/lib.rs
          grep -q "MAX_GUIDES: usize = 50" host-rust/src/lib.rs
          grep -q '"Num Columns"' host-rust/src/lib.rs
          grep -q '"Smoothstep", "Gaussian", "Linear"' host-rust/src/lib.rs
          grep -q "extra.set_gpu_render_possible(false)" host-rust/src/lib.rs
          zsh -n tools/stage_hot_reload_macos.command
          zsh -n tools/install_hot_loader_package.command
          grep -q "CLEAN ELASTICGRID ORIGINAL-PARITY INSTALL COMPLETE" tools/install_hot_loader_package.command
          grep -q "com.elasticgrid.fx" tools/install_hot_loader_package.command
          grep -q "FSTR FX/ElasticGrid.plugin" tools/install_hot_loader_package.command
          zsh -n tools/stage_packaged_hot_reload.command
          zsh -n tools/rollback_packaged_hot_reload.command
          zsh -n tools/collect_hot_loader_logs.command
          bash -n tools/build_macos_sdkless.command
          bash -n tools/verify_bundle_macos.command
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror \
            -fsyntax-only host-rust/shell/ElasticGridShell.cpp

      - name: Build implementation
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-hot-default
          AE_HOT_LOADER_IMPL_LABEL: elasticgrid-default
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path host-rust/Cargo.toml --target aarch64-apple-darwin

      - name: Test implementation state contract
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-hot-default
          AE_HOT_LOADER_IMPL_LABEL: elasticgrid-default
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path host-rust/Cargo.toml --target aarch64-apple-darwin

      - name: Build candidate implementation
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-hot-candidate
          AE_HOT_LOADER_IMPL_LABEL: elasticgrid-candidate-v2
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path host-rust/Cargo.toml --target aarch64-apple-darwin

      - name: Build shell and assemble bundle
        run: |
          set -euo pipefail
          ROOT="target-hot-default/aarch64-apple-darwin/release"
          CANDIDATE_ROOT="target-hot-candidate/aarch64-apple-darwin/release"
          BUNDLE="dist/mac/ElasticGrid.plugin"

          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Frameworks" "$BUNDLE/Contents/Resources"

          xcrun clang++ -std=c++17 -O2 -arch arm64 -mmacosx-version-min=11.0 -dynamiclib -fvisibility=hidden \
            host-rust/shell/ElasticGridShell.cpp \
            -o "$BUNDLE/Contents/MacOS/ElasticGrid"

          cp "$ROOT/libelasticgrid_ae.dylib" "$BUNDLE/Contents/Frameworks/libelasticgrid_impl.dylib"
          cp "$ROOT/elasticgrid_ae.rsrc" "$BUNDLE/Contents/Resources/ElasticGrid.rsrc"
          cp "$ROOT/elasticgrid_ae_PkgInfo" "$BUNDLE/Contents/PkgInfo"
          cp "$ROOT/elasticgrid_ae_Info.plist" "$BUNDLE/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.elasticgrid.fx' "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string ElasticGrid' "$BUNDLE/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable ElasticGrid' "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string "ElasticGrid FX"' "$BUNDLE/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Set :CFBundleName "ElasticGrid FX"' "$BUNDLE/Contents/Info.plist"

          codesign --force --sign - "$BUNDLE/Contents/Frameworks/libelasticgrid_impl.dylib"
          codesign --force --deep --sign - "$BUNDLE"
          tools/verify_bundle_macos.command "$BUNDLE"

          strings "$BUNDLE/Contents/Frameworks/libelasticgrid_impl.dylib" | grep 'elasticgrid-default'
          strings "$CANDIDATE_ROOT/libelasticgrid_ae.dylib" | grep 'elasticgrid-candidate-v2'
          for impl in "$BUNDLE/Contents/Frameworks/libelasticgrid_impl.dylib" "$CANDIDATE_ROOT/libelasticgrid_ae.dylib"; do
            nm -gU "$impl" | grep -E 'EffectMain|AEHotLoader_ImplementationABI|AEHotLoader_ImplementationStateABI|AEHotLoader_ImplementationKey|AEHotLoader_ImplementationLabel|AEHotLoader_ImplementationRuntimeABI|AEHotLoader_SetGeneration'
          done
          for impl in "$BUNDLE/Contents/Frameworks/libelasticgrid_impl.dylib" "$CANDIDATE_ROOT/libelasticgrid_ae.dylib"; do
            if otool -L "$impl" | tail -n +2 | grep -E '@(rpath|loader_path|executable_path)'; then
              echo "ERROR: hot-reload implementation has relative/private dylib dependencies: $impl"
              exit 6
            fi
          done
          for bin in             "$BUNDLE/Contents/MacOS/ElasticGrid"             "$BUNDLE/Contents/Frameworks/libelasticgrid_impl.dylib"             "$CANDIDATE_ROOT/libelasticgrid_ae.dylib"; do
            xcrun vtool -show-build "$bin" | grep -Eq 'minos[[:space:]]+11\.0' || {
              echo "ERROR: unexpected macOS deployment target: $bin"
              xcrun vtool -show-build "$bin"
              exit 7
            }
          done

      - name: Smoke bundled default to candidate reload
        shell: bash
        run: |
          set -euo pipefail
          FAKE_HOME="$RUNNER_TEMP/hot-loader-home"
          IMPL_DIR="$FAKE_HOME/Library/Application Support/AE Hot Loader/implementations/elasticgrid"
          mkdir -p "$IMPL_DIR"

          cat > "$RUNNER_TEMP/reload_smoke.cpp" <<'CPP'
          #include <cstdlib>
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          #include <filesystem>
          using ReloadFn = int (*)(char*, std::size_t);

          int main(int argc, char** argv) {
              if (argc != 5) return 10;
              void* handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!handle) { std::fprintf(stderr, "%s\n", dlerror()); return 11; }
              auto reload = reinterpret_cast<ReloadFn>(dlsym(handle, "AEHotLoader_ShellReload"));
              if (!reload) return 12;

              char initial[2048]{};
              const int first = reload(initial, sizeof(initial));
              std::printf("initial=%d %s\n", first, initial);
              if (first != 0 || std::strstr(initial, argv[3]) == nullptr) return 13;

              const char* home = std::getenv("HOME");
              if (!home) return 14;
              std::filesystem::path current =
                  std::filesystem::path(home) /
                  argv[4] /
                  "current.dylib";
              std::filesystem::create_directories(current.parent_path());
              std::filesystem::copy_file(
                  argv[2], current, std::filesystem::copy_options::overwrite_existing);

              char candidate[2048]{};
              const int second = reload(candidate, sizeof(candidate));
              std::printf("candidate=%d %s\n", second, candidate);
              if (second != 0 || std::strstr(candidate, "candidate") == nullptr) return 15;

              char unchanged[2048]{};
              const int third = reload(unchanged, sizeof(unchanged));
              std::printf("unchanged=%d %s\n", third, unchanged);
              if (third != 1) return 16;

              std::filesystem::remove(current);

              char rollback[2048]{};
              const int rollback_result = reload(rollback, sizeof(rollback));
              std::printf("rollback=%d %s\n", rollback_result, rollback);
              if (rollback_result != 0 ||
                  std::strstr(rollback, "elasticgrid-default") == nullptr) {
                  return 17;
              }

              char rollback_unchanged[2048]{};
              const int rollback_unchanged_result =
                  reload(rollback_unchanged, sizeof(rollback_unchanged));
              std::printf(
                  "rollback-unchanged=%d %s\n",
                  rollback_unchanged_result,
                  rollback_unchanged);
              if (rollback_unchanged_result != 1) return 18;

              return 0;
          }
          CPP

          xcrun clang++ -std=c++17 -arch arm64 "$RUNNER_TEMP/reload_smoke.cpp" -o "$RUNNER_TEMP/reload_smoke"
          HOME="$FAKE_HOME" "$RUNNER_TEMP/reload_smoke" \
            "$(pwd)/dist/mac/ElasticGrid.plugin/Contents/MacOS/ElasticGrid" \
            "$(pwd)/target-hot-candidate/aarch64-apple-darwin/release/libelasticgrid_ae.dylib" \
            "elasticgrid-default" \
            "Library/Application Support/AE Hot Loader/implementations/elasticgrid"

      - name: Package hot-loader test kit
        run: |
          set -euo pipefail
          rm -rf package ElasticGridFX-hot-loader-shell.zip
          mkdir -p package
          cp -R dist/mac/ElasticGrid.plugin package/
          cp target-hot-candidate/aarch64-apple-darwin/release/libelasticgrid_ae.dylib package/ElasticGridImpl-candidate.dylib
          cp tools/install_hot_loader_package.command package/INSTALL_HOT_LOADER.command
          cp tools/stage_packaged_hot_reload.command package/STAGE_CANDIDATE.command
          cp tools/rollback_packaged_hot_reload.command package/ROLLBACK_TO_BUNDLED.command
          cp tools/collect_hot_loader_logs.command package/COLLECT_LOGS.command
          cp docs/hot-loader-live-test.md package/ELASTICGRID_LIVE_TEST.md
          cp docs/original-gridwarp-binary-audit.md package/ORIGINAL_GRIDWARP_AUDIT.md
          chmod +x package/INSTALL_HOT_LOADER.command package/STAGE_CANDIDATE.command package/ROLLBACK_TO_BUNDLED.command package/COLLECT_LOGS.command
          codesign --force --sign - package/ElasticGridImpl-candidate.dylib
          ditto -c -k --sequesterRsrc --keepParent package ElasticGridFX-hot-loader-shell.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ElasticGridFX-hot-loader-shell
          path: ElasticGridFX-hot-loader-shell.zip
          if-no-files-found: error
